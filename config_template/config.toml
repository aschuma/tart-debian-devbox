# Global defaults for tctl. Project .tart-ctl.toml overrides these per key.
# VM names belong to projects, never here.

[ssh]
user = "devbox"
config_path = "~/.ssh/config"
identity_file = "~/.ssh/id_ed25519_tart"
remote_forward = ["1080 127.0.0.1:1080"]
local_forward = []

[share]
dir = "auto" # "auto" = project root, "none" = no share, or a host directory

[provision]
env_files = [".env"] # later files override earlier keys
