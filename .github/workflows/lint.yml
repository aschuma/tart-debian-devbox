---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible, ansible-lint, yamllint
        run: pip install ansible ansible-lint yamllint

      - name: Install collections
        working-directory: build/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint build/ansible .github

      - name: ansible-playbook --syntax-check
        working-directory: build/ansible
        run: ansible-playbook --syntax-check -i localhost, playbook.yml

      - name: ansible-lint
        working-directory: build/ansible
        run: ansible-lint

      - uses: hashicorp/setup-packer@v3

      - name: packer validate
        working-directory: build
        run: |
          packer init debian-ssh.pkr.hcl
          packer validate -var-file=vars.pkrvars.hcl debian-ssh.pkr.hcl
