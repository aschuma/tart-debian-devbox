---
name: tctl release

on:
  push:
    tags: ['tctl-v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - name: Install test tools
        run: brew install just
      - name: Test without real VMs
        run: just test
      - name: Build Apple Silicon binary
        run: cargo build --manifest-path tctl/Cargo.toml --locked --release --target aarch64-apple-darwin
      - name: Package
        run: |
          mkdir -p dist
          cp tctl/target/aarch64-apple-darwin/release/tctl LICENSE dist/
          tar -C dist -czf tctl-aarch64-apple-darwin.tar.gz tctl LICENSE
          shasum -a 256 tctl-aarch64-apple-darwin.tar.gz > tctl-aarch64-apple-darwin.tar.gz.sha256
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" tctl-aarch64-apple-darwin.tar.gz tctl-aarch64-apple-darwin.tar.gz.sha256 --clobber
