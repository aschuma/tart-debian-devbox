---
name: tctl

on:
  push:
    paths:
      - 'tctl/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config_template/**'
      - 'justfile'
      - '.github/workflows/tctl.yml'
  pull_request:
    paths:
      - 'tctl/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config_template/**'
      - 'justfile'
      - '.github/workflows/tctl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install test tools
        run: brew install just
      - name: Test without real VMs
        run: just test
