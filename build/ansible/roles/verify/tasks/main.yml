---
- name: Check {{ devbox_user }} account and groups
  ansible.builtin.command: id -nG {{ devbox_user }}
  register: verify_groups
  changed_when: false

- name: Assert {{ devbox_user }} is in sudo and docker groups
  ansible.builtin.assert:
    that:
      - "'sudo' in verify_groups.stdout.split()"
      - "'docker' in verify_groups.stdout.split()"
    fail_msg: "{{ devbox_user }} groups: {{ verify_groups.stdout }}"
    success_msg: "{{ devbox_user }} groups: {{ verify_groups.stdout }}"

- name: Verify installed tools
  ansible.builtin.include_role:
    name: mise
    tasks_from: verify
  vars:
    mise_verify_commands: "{{ verify_commands }}"

- name: List mise-managed tools
  become: true
  become_user: "{{ devbox_user }}"
  ansible.builtin.command: bash -lc 'mise ls'
  register: verify_mise_ls
  changed_when: false

- name: Show mise-managed tools
  ansible.builtin.debug:
    msg: "{{ verify_mise_ls.stdout_lines }}"

- name: Install bash completion for mise-managed CLIs
  become: true
  become_user: "{{ devbox_user }}"
  ansible.builtin.shell: bash -lc '{{ item.cmd }}' > /tmp/{{ item.name }}.bash
  loop:
    - { name: gh, cmd: gh completion -s bash }
    - { name: docker, cmd: docker completion bash }
  changed_when: true

- name: Move completions into place
  ansible.builtin.copy:
    src: /tmp/{{ item }}.bash
    dest: /etc/bash_completion.d/{{ item }}
    remote_src: true
    mode: '0644'
  loop: [gh, docker]

- name: Clean up completion temp files
  ansible.builtin.file:
    path: /tmp/{{ item }}.bash
    state: absent
  loop: [gh, docker]

- name: Write message of the day
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    mode: '0644'
