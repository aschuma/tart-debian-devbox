---
- name: Install OpenSSH server and sudo
  ansible.builtin.apt:
    name:
      - openssh-server
      - sudo
    state: present
    update_cache: true

# password '*' = no password login but account NOT locked; the default '!'
# marks the account locked and sshd then refuses public-key auth as well.
- name: Create {{ devbox_user }} user
  ansible.builtin.user:
    name: "{{ devbox_user }}"
    password: '*'
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Grant {{ devbox_user }} passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ devbox_user }}"
    content: "{{ devbox_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Ensure .ssh directory exists for {{ devbox_user }}
  ansible.builtin.file:
    path: "{{ devbox_home }}/.ssh"
    state: directory
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0700'

- name: Add authorized key for {{ devbox_user }}
  ansible.posix.authorized_key:
    user: "{{ devbox_user }}"
    key: "{{ lookup('file', user_ssh_key_path) }}"
    state: present
  when: user_ssh_key_path | length > 0

- name: Remove legacy deploy user
  ansible.builtin.user:
    name: deploy
    state: absent
    remove: true

- name: Copy hardened sshd_config
  ansible.builtin.copy:
    src: sshd_config
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Enable and start SSH
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started

- name: Verify {{ devbox_user }} account
  ansible.builtin.command: id {{ devbox_user }}
  register: user_id
  changed_when: false

- name: Show {{ devbox_user }} account
  ansible.builtin.debug:
    msg: "{{ user_id.stdout }}"
