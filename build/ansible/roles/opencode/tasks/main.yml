---
- name: Check if opencode-ai is installed
  become_user: "{{ devbox_user }}"
  ansible.builtin.command: bash -lc 'opencode --version'
  register: opencode_check
  failed_when: false
  changed_when: false

- name: Install opencode-ai
  become_user: "{{ devbox_user }}"
  ansible.builtin.command: bash -lc 'npm install -g opencode-ai'
  async: 600
  poll: 10
  when: opencode_check.rc != 0
  changed_when: true
