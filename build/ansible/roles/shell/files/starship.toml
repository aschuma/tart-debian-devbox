# ── Starship prompt — devbox VM (installed to ~/.config/starship.toml) ───────
# Layout: OS · path · git · python venv · java · node · docker │ memory · duration · time
# Glyphs need a Nerd Font (https://www.nerdfonts.com) in the *host* terminal.
# Reference: https://starship.rs/config/

format = """
$os\
$directory\
$git_branch\
$git_status\
$python\
$java\
$nodejs\
$docker_context\
$fill\
$memory_usage\
$cmd_duration\
$time\
$line_break\
$character"""

# Raise timeout to give custom modules room to breathe
scan_timeout = 200
command_timeout = 1000

# ── OS icon ──────────────────────────────────────────────────────────────────
[os]
disabled = false
format = "[$symbol ]($style)"
style = "bold blue"

[os.symbols]
Debian = ""
Linux = ""

# ── Directory ────────────────────────────────────────────────────────────────
[directory]
format = "[ $path ]($style)[$read_only]($read_only_style) "
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"

# ── Git ──────────────────────────────────────────────────────────────────────
[git_branch]
format = "[ $symbol$branch(:$remote_branch) ]($style)"
symbol = " "
style = "bold purple"
truncation_length = 24
truncation_symbol = "…"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = " ${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# ── Python virtualenv ────────────────────────────────────────────────────────
[python]
format = "[ $symbol$virtualenv ]($style)"
symbol = " "
style = "bold yellow"
pyenv_version_name = false

# ── Java ─────────────────────────────────────────────────────────────────────
[java]
disabled = false
format = "[ $symbol($version) ]($style)"
symbol = "☕ "
style = "bold red"
# shown when pom.xml, build.gradle(.kts), settings.gradle(.kts), *.java/.class/.jar are present

# ── Node.js ──────────────────────────────────────────────────────────────────
[nodejs]
disabled = false
format = "[ $symbol($version) ]($style)"
symbol = " "
style = "bold green"
# shown when package.json, .nvmrc, .node-version or node_modules/ are present

# ── Docker context ───────────────────────────────────────────────────────────
[docker_context]
disabled = false
format = "[ $symbol$context ]($style)"
symbol = " "
style = "bold blue"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

# ── Right side ───────────────────────────────────────────────────────────────
[fill]
symbol = " "

[memory_usage]
disabled = false
format = "[$symbol$ram ]($style)"
symbol = "󰾆 "
style = "#808080"
threshold = 0

[cmd_duration]
disabled = false
min_time = 0
format = "[ $duration ]($style)"
style = "bold bright-white"
show_milliseconds = true

[time]
disabled = false
format = "[ $time ]($style)"
time_format = "%H:%M"
style = "bold bright-white"

# ── Prompt character ─────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

