---
# Login shell of the devbox user
shell_login_shell: /bin/zsh

# Where generated completions are installed
shell_bash_completion_dir: /etc/bash_completion.d
shell_zsh_completion_dir: /usr/local/share/zsh/site-functions  # in Debian's default $fpath

# CLIs that can emit their own completion scripts (run as devbox in a login shell,
# so mise-managed tools are found). The `name` is used as file name.
shell_completions:
  - name: mise
    bash: mise completion bash
    zsh: mise completion zsh
  - name: gh
    bash: gh completion -s bash
    zsh: gh completion -s zsh
  - name: docker
    bash: docker completion bash
    zsh: docker completion zsh
  - name: uv
    bash: uv generate-shell-completion bash
    zsh: uv generate-shell-completion zsh
  - name: ruff
    bash: ruff generate-shell-completion bash
    zsh: ruff generate-shell-completion zsh
  - name: starship
    bash: starship completions bash
    zsh: starship completions zsh

# Verified by roles/verify
shell_verify_commands:
  - zsh --version
  - starship --version
  - zsh -c 'java --version'  # non-interactive zsh → mise shims via ~/.zshenv
  - zsh -lc 'java --version'  # login zsh → /etc/profile re-sets PATH, mise.sh re-adds shims
  - zsh -lic 'whence -w prompt_starship_precmd'  # interactive zsh → ~/.zshrc loaded, starship hooked
