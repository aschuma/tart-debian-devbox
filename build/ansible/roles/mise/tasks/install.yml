---
# Reusable task file: installs the subset of globally configured tools given in
# `mise_install_tools` (dict, same shape as mise_tools) for the devbox user.
# Usage:
#   - ansible.builtin.include_role:
#       name: mise
#       tasks_from: install
#     vars:
#       mise_install_tools: "{{ mise_runtimes }}"

- name: List missing mise tools
  become_user: "{{ devbox_user }}"
  ansible.builtin.command: bash -lc 'mise ls --missing --json'
  register: mise_missing_raw
  changed_when: false

- name: Determine which requested tools are missing
  ansible.builtin.set_fact:
    mise_missing_tools: >-
      {{ (mise_missing_raw.stdout | from_json).keys() | list
         | intersect(mise_install_tools.keys() | list) }}

- name: Install missing tools via mise ({{ mise_missing_tools | join(', ') }})
  become_user: "{{ devbox_user }}"
  ansible.builtin.command: >-
    bash -lc 'mise install --yes {{ mise_missing_tools | map('quote') | join(' ') }}'
  async: 3600
  poll: 15
  when: mise_missing_tools | length > 0
  changed_when: true
