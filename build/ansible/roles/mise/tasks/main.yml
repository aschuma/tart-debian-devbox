---
- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Check if mise GPG keyring already exists
  ansible.builtin.stat:
    path: "{{ mise_keyring }}"
  register: mise_keyring_stat

- name: Download mise GPG key
  ansible.builtin.get_url:
    url: "{{ mise_gpg_url }}"
    dest: /tmp/mise.asc
    mode: '0644'
    timeout: 600
  when: not mise_keyring_stat.stat.exists

- name: Dearmor mise GPG key
  ansible.builtin.command: gpg --batch --yes --dearmor -o "{{ mise_keyring }}" /tmp/mise.asc
  when: not mise_keyring_stat.stat.exists
  changed_when: not mise_keyring_stat.stat.exists

- name: Set keyring permissions
  ansible.builtin.file:
    path: "{{ mise_keyring }}"
    mode: '0644'

- name: Add mise apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/mise.list
    content: "deb [signed-by={{ mise_keyring }} arch={{ mise_arch }}] {{ mise_repo_url }} stable main\n"
    mode: '0644'
  register: mise_repo

- name: Refresh apt cache after adding mise repo
  ansible.builtin.apt:
    update_cache: true
  when: mise_repo.changed

- name: Install mise
  ansible.builtin.apt:
    name: mise
    state: present

- name: Activate mise in login shells
  ansible.builtin.copy:
    src: mise.sh
    dest: /etc/profile.d/mise.sh
    mode: '0644'

- name: Activate mise in interactive shells of {{ devbox_user }}
  ansible.builtin.lineinfile:
    path: "{{ devbox_home }}/.bashrc"
    line: 'command -v mise >/dev/null 2>&1 && eval "$(mise activate bash)"'
    regexp: 'mise activate bash'
    create: true
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0644'

- name: Create mise config directory
  ansible.builtin.file:
    path: "{{ mise_config_dir }}"
    state: directory
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0755'

- name: Generate global mise config
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ mise_config_file }}"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0644'

- name: Verify mise
  ansible.builtin.command: mise --version
  register: mise_ver
  changed_when: false

- name: Show mise version
  ansible.builtin.debug:
    msg: "{{ mise_ver.stdout }}"

# Informational only here: mise doctor exits 1 while configured tools are not
# yet installed. The strict check runs in the verify role after installation.
- name: Run mise doctor as {{ devbox_user }}
  become_user: "{{ devbox_user }}"
  ansible.builtin.command: bash -lc 'mise doctor'
  register: mise_doctor
  changed_when: false
  failed_when: false

- name: Show mise doctor summary
  ansible.builtin.debug:
    msg: "{{ mise_doctor.stdout_lines | select('match', '^(version|activated|shims_on_path|config_files|\\d+ problems).*') | list }}"

- name: Clean up mise GPG key download
  ansible.builtin.file:
    path: /tmp/mise.asc
    state: absent
