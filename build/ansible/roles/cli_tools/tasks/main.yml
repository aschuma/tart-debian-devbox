---
- name: Install CLI tools via mise
  ansible.builtin.include_role:
    name: mise
    tasks_from: install
  vars:
    mise_install_tools: "{{ mise_cli_tools }}"

- name: Verify CLI tools
  ansible.builtin.include_role:
    name: mise
    tasks_from: verify
  vars:
    mise_verify_commands: "{{ cli_tools_verify_commands }}"
