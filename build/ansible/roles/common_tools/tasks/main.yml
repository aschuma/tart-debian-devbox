---
- name: Install base CLI tools
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - jq
      - git
      - vim
      - unzip
      - zip
      - net-tools
      - dnsutils
      - iputils-ping
      - htop
      - tree
      - rsync
      - gnupg
      - acl
      - ca-certificates
      - lsb-release
      - apt-transport-https
      - build-essential
      - python3-pip
      - postgresql-client
    state: present

- name: Configure Git defaults for {{ devbox_user }}
  become_user: "{{ devbox_user }}"
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: core.autocrlf, value: input }
    - { name: init.defaultBranch, value: main }
