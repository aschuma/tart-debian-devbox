---
- name: Install base CLI tools
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - jq
      - git
      - vim
      - unzip
      - zip
      - net-tools
      - dnsutils
      - iputils-ping
      - htop
      - tree
      - rsync
      - gnupg
      - acl
      - bash-completion
      - ca-certificates
      - lsb-release
      - apt-transport-https
      - build-essential
      - postgresql-client
    state: present

# Tart exposes every `--dir=NAME:PATH` share under one fixed virtiofs tag.
# systemd automount mounts it on first access; `nofail` + `noauto` keep boot
# clean when the VM was started without a share.
- name: Auto-mount the Tart virtiofs share at boot
  ansible.posix.mount:
    path: /mnt/shared
    src: com.apple.virtio-fs.automount
    fstype: virtiofs
    opts: noauto,x-systemd.automount,nofail
    state: present

- name: Configure Git defaults for {{ devbox_user }}
  become: true
  become_user: "{{ devbox_user }}"
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: core.autocrlf, value: input }
    - { name: init.defaultBranch, value: main }
