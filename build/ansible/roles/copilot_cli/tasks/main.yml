---
- name: Check if @github/copilot is installed
  become_user: "{{ devbox_user }}"
  ansible.builtin.command: bash -lc 'copilot --version'
  register: copilot_cli_check
  failed_when: false
  changed_when: false

- name: Install @github/copilot
  become_user: "{{ devbox_user }}"
  ansible.builtin.command: bash -lc 'npm install -g @github/copilot'
  async: 600
  poll: 10
  when: copilot_cli_check.rc != 0
  changed_when: true
