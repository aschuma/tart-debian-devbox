---
# =============================================================================
# playbook.yml — Ansible Playbook for Tart Debian 12 (Bookworm) Dev VM
#
# Pure orchestration: roles run in order, no inline tasks.
# Tool versions: group_vars/all/tool_versions.yml
# =============================================================================

- name: Provision Debian 12 (Bookworm) Dev VM
  hosts: all
  become: true
  gather_facts: true

  # ---------------------------------------------------------------------------
  pre_tasks:

    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600
      tags: [always]

  # ---------------------------------------------------------------------------
  roles:

    - role: user          # devbox account, SSH keys, sshd hardening
      tags: [user]

    - role: common_tools  # base apt packages, git defaults
      tags: [tools]

    - role: docker        # Docker CE + Compose plugin (apt)
      tags: [docker]

    - role: mise          # mise binary, shell activation, global config
      tags: [mise]

    - role: runtimes      # Java, Node.js, Gradle, Maven, Kotlin, GraalPy (mise)
      tags: [runtimes]

    - role: cli_tools     # gh, aws-cli, terraform, packer, uv, acli, AI CLIs (mise)
      tags: [cli-tools]

    - role: verify        # final gate — build fails if any check fails
      tags: [verify]

  # ---------------------------------------------------------------------------
  post_tasks:

    - name: Clean up apt cache
      ansible.builtin.apt:
        autoclean: true
        autoremove: true
      tags: [always]

    - name: Provisioning complete
      ansible.builtin.debug:
        msg: >-
          Done — user={{ devbox_user }};
          mise runtimes: {{ mise_runtimes.keys() | join(', ') }};
          mise CLI tools: {{ mise_cli_tools.keys() | join(', ') }};
          Docker installed.
      tags: [always]
