---
# =============================================================================
# playbook.yml — Ansible Playbook for Tart Debian 12 (Bookworm) VM
#
# Installs: CLI tools, Docker, mise-managed runtimes (Java, Gradle, Maven, Kotlin, GraalPy)
# =============================================================================

- name: Provision Debian 12 (Bookworm) Dev VM
  hosts: all
  become: true
  gather_facts: true

  # ---------------------------------------------------------------------------
  pre_tasks:

    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600
      tags: [always]

  # ---------------------------------------------------------------------------
  roles:

    - role: user
      tags: [user]

    - role: common_tools
      tags: [tools]

    - role: mise
      tags: [mise]

    - role: runtimes
      tags: [runtimes]

    - role: nvm
      tags: [nvm]

    - role: acli
      tags: [acli]

    - role: copilot_cli
      tags: [copilot-cli]

    - role: opencode
      tags: [opencode]

    - role: docker
      tags: [docker]

    - role: uv
      tags: [uv]

  # ---------------------------------------------------------------------------
  post_tasks:

    - name: Clean up apt cache
      ansible.builtin.apt:
        autoclean: true
        autoremove: true
      tags: [always]

    - name: Provisioning complete
      ansible.builtin.debug:
        msg: >-
          Done — runtimes via mise: {{ mise_runtimes.keys() | join(', ') }};
          nvm={{ nvm_version }} Node.js={{ node_version }} uv={{ uv_version }}
          Docker and Atlassian CLI installed. Reboot recommended for docker group changes.
      tags: [always]
