---
# Single developer account on the VM. The base image's `admin` account is only
# used by Packer/Ansible during the build and is left untouched.
devbox_user: devbox
devbox_home: "/home/{{ devbox_user }}"

# Debian architecture of the VM (Apple Silicon → arm64)
target_arch: arm64

# Always use the system interpreter. devbox's PATH starts with the mise shims
# (python3 → mise-managed CPython), which must not be used for Ansible modules
# (interpreter discovery would pick the shim, and it hangs under sudo).
ansible_python_interpreter: /usr/bin/python3
