[package]
name = "tctl"
version = "0.1.0"
edition = "2021"
description = "Control Tart-based Debian dev VMs built by this repository"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "tctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
similar = "2"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
ureq = { version = "2", features = ["json"] }
# Kept on the same minor as axum's tokio-tungstenite so only one version builds.
tungstenite = "0.29"
